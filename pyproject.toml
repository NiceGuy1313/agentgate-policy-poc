[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "Deterministic tool-call policy engine PoC on top of AgentDojo"
requires-python = ">=3.10"
dependencies = [
    "agentdojo==0.1.35",
    "anthropic>=1",
    "openai>=3",
    "pydantic>=2",
    "pyyaml>=6",
    "requests>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "ruff>=0.6", "httpx>=0.27"]
report = ["matplotlib>=3.8"]
# tool-response injection detectors (src/agentgate/detector/). Install CPU torch first in the cloud (scripts/cloud/setup.sh)
detector = ["torch>=2.2", "transformers>=4.44", "sentencepiece>=0.2", "protobuf>=4", "huggingface_hub>=0.24"]
# dashboard + Wrapper contract v1 service (dashboard/app.py, agentgate.harness.service)
dashboard = ["fastapi>=0.110", "uvicorn>=0.30"]
# agent frameworks under test: the NiceGuy1313 forks carry the boundary logs the dashboard reads
smolagents = ["smolagents[litellm] @ git+https://github.com/NiceGuy1313/smolagents@74139966ac0842b84f43c6f0fca03284348591da"]
mini-swe-agent = ["mini-swe-agent @ git+https://github.com/NiceGuy1313/mini-swe-agent@d1fe8af5dc44802780949d6488b41c96f5774f01"]
# browser-use pins anthropic/openai below agentgate's floor: install it in its own venv (README), not next to agentgate
browser-use = ["browser-use @ git+https://github.com/NiceGuy1313/browser-use@f39fb5c3a6fc611688007819c71ef104bd6ca01a"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I"]
