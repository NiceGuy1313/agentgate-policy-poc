[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "Tool-call policy gate for LLM agents, evaluated on AgentDojo"
requires-python = ">=3.10"
dependencies = [
    "agentdojo==0.1.35",
    "anthropic>=1",
    "openai>=3",
    "pydantic>=2",
    "pyyaml>=6",
    "requests>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
# dashboard + Wrapper contract v1 service (dashboard/app.py, agentgate.harness.service)
dashboard = ["fastapi>=0.110", "uvicorn>=0.30"]
# agent frameworks under test: the NiceGuy1313 forks carry the boundary logs the dashboard reads
smolagents = ["smolagents[litellm] @ git+https://github.com/NiceGuy1313/smolagents@74139966ac0842b84f43c6f0fca03284348591da"]
mini-swe-agent = ["mini-swe-agent @ git+https://github.com/NiceGuy1313/mini-swe-agent@d1fe8af5dc44802780949d6488b41c96f5774f01"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I"]
