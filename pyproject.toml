[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "Deterministic tool-call policy engine PoC on top of AgentDojo"
requires-python = ">=3.10"
dependencies = [
    "agentdojo==0.1.35",
    "anthropic>=1",
    "openai>=3",
    "pydantic>=2",
    "pyyaml>=6",
    "requests>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "ruff>=0.6"]
report = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I"]
