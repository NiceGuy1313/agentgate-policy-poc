# 호출 시 상태를 바꾸거나 데이터를 외부로 보내는 툴("effect" 호출).
# 그 밖의 툴은 모두 "prep" 호출(읽기·검색)이다. 이름은 실제 AgentDojo v1.2.2 툴 이름이다.
effect:
  external_send: [send_email, send_direct_message, send_channel_message, post_webpage]
  share: [share_file]
  write: [create_file, append_to_file, create_calendar_event, reschedule_calendar_event,
          add_calendar_event_participants, cancel_calendar_event]
  delete: [delete_email, delete_file, remove_user_from_slack]
  money: [send_money, schedule_transaction, update_scheduled_transaction]
  account: [update_password, update_user_info, invite_user_to_slack, add_user_to_channel]
  reservation: [reserve_hotel, reserve_car_rental, reserve_restaurant]
  # get_webpage only reads, but visiting an attacker URL is itself the goal of slack
  # injection_task_3 (it leaks the visit to the attacker's server), so it is counted as effect.
  visit: [get_webpage]
