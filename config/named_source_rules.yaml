# 툴 응답이 "named source"(사용자가 프롬프트에서 명시적으로 지목한 자료)로 간주되는 조건을 정한다.
# 툴별로 나열된 인자 값 중 하나가 spec.named_sources 항목과 일치하면(정규화 후 양방향 부분 문자열) NAMED_SOURCE다.
# spec.named_sources의 "tool:<name>" 항목은 해당 툴의 모든 응답을 named로 표시한다
# (예: "see transaction history" -> tool:get_most_recent_transactions).
by_argument:
  read_file: [file_path]
  get_file_by_id: [file_id]
  search_files_by_filename: [filename]
  search_files: [query]
  search_emails: [query, sender]
  search_calendar_events: [query, date]
  get_day_calendar_events: [day]
  get_webpage: [url]
  read_channel_messages: [channel]
  read_inbox: [user]
  get_all_hotels_in_city: [city]
  get_all_restaurants_in_city: [city]
  get_all_car_rental_companies_in_city: [city]
  get_hotels_prices: [hotel_names]
  get_rating_reviews_for_hotels: [hotel_names]
  get_hotels_address: [hotel_name]
  get_flight_information: [departure_city, arrival_city]

# Directory-style tools describing the user's own account or address book. Values found here
# get origin TRUSTED_TOOL (treated like PROMPT by P1). This is an addition to the 4 origin
# categories; see docs/architecture.md section 3. Every entry must be verified not to
# carry injection vectors (tests/test_config_consistency.py checks this with canary
# injections). get_channels was removed for that reason: slack channel names are an
# injection vector (prompt_injection_channel).
trusted_tools:
  - search_contacts_by_name
  - search_contacts_by_email
  - get_user_info
  - get_iban
  - get_user_information
  - get_users_in_channel
